services:
  backend:
    build:
      context: .
    env_file:
      - .env
    environment:
      PORT: "5000"
    ports:
      - "5013:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
