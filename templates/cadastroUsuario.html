<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de usuário — FrequenIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/frequenia-global.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastroUsuario.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css') }}">
</head>
<body>
  <form id="formCadastro">
    <div class="perfil-page">
      <section class="card">
        <h3>Identidade e acesso</h3>
        <div class="grid">
          <div class="campo"><label for="nome">Nome</label><input type="text" id="nome" required></div>
          <div class="campo"><label for="email">E-mail</label><input type="email" id="email" required></div>
          <div class="campo"><label for="telefone">Telefone</label><input type="text" id="telefone" maxlength="15" oninput="mascaraTelefone(this)" required></div>
          <div class="campo"><label for="cpf">CPF</label><input type="text" id="cpf" maxlength="14" oninput="mascaraCPF(this)" required></div>
          <div class="campo"><label for="senha">Senha inicial</label><input type="password" id="senha" minlength="12" autocomplete="new-password" required></div>
        </div>
      </section>

      <section class="card">
        <h3>Vínculo funcional</h3>
        <div class="grid">
          <div class="campo"><label for="empresa">Empresa</label><select id="empresa" required><option value="">Selecione</option></select></div>
          <div class="campo"><label for="unidade">Unidade</label><select id="unidade" required disabled><option value="">Selecione</option></select></div>
          <div class="campo"><label for="equipe">Equipe</label><select id="equipe" required disabled><option value="">Selecione</option></select></div>
          <div class="campo"><label for="cargo">Cargo</label><select id="cargo" required disabled><option value="">Selecione</option></select></div>
          <div class="campo"><label for="matricula">Matrícula</label><input type="text" id="matricula" required></div>
          <div class="campo">
            <label for="perfil">Perfil funcional</label>
            <select id="perfil" required>
              <option value="">Selecione</option>
              <option value="funcionario">Funcionário</option>
              <option value="gestor">Gestor</option>
              <option value="rh">RH</option>
              <option value="administrador">Administrador</option>
            </select>
          </div>
          <div class="campo">
            <label for="tipo_contrato">Tipo de contrato</label>
            <select id="tipo_contrato" required>
              <option value="">Selecione</option>
              <option value="efetivo">Efetivo</option>
              <option value="comissionado">Comissionado</option>
              <option value="temporario">Temporário</option>
              <option value="estagiario">Estagiário</option>
              <option value="terceirizado">Terceirizado</option>
              <option value="outro">Outro</option>
            </select>
          </div>
          <div class="campo"><label for="data_admissao">Data de admissão</label><input type="date" id="data_admissao" required></div>
          <div class="campo"><label for="carga_horaria">Carga horária semanal</label><input type="number" id="carga_horaria" min="1" max="168" step="0.5" required></div>
        </div>
      </section>

      <div class="acoes"><button type="button" class="btn-cad" onclick="cadastrarUsuario()">Salvar cadastro</button></div>
    </div>
  </form>
  <script src="{{ url_for('static', filename='js/cadastroUsuario.js') }}"></script>
</body>
</html>
