<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de usuário — FrequenIA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/frequenia-global.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ocorrencias.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastroUsuario.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css', v='dark-palette-2026-11') }}">
</head>
<body>
  <form id="formCadastro" data-validate-registration novalidate>
    <main class="occurrences-page cadastro-page">
      <header class="page-header">
        <div><span class="eyebrow">GESTÃO / CADASTROS</span><h1>Cadastrar funcionário</h1><p>Registre os dados de acesso e o vínculo funcional na empresa.</p></div>
      </header>
      <section class="filter-card cadastro-section">
        <div class="section-heading"><div><span class="section-kicker">DADOS PESSOAIS</span><h2>Identidade e acesso</h2></div></div>
        <div class="grid">
          <div class="campo"><label for="nome">Nome</label><input type="text" id="nome" maxlength="160" autocomplete="name" data-person-name required></div>
          <div class="campo"><label for="email">E-mail</label><input type="email" id="email" required></div>
          <div class="campo"><label for="telefone">Telefone</label><input type="tel" id="telefone" maxlength="15" autocomplete="tel-national" placeholder="(11) 99999-9999" data-br-phone required></div>
          <div class="campo"><label for="cpf">CPF</label><input type="text" id="cpf" inputmode="numeric" maxlength="14" oninput="mascaraCPF(this)" data-cpf required></div>
        </div>
      </section>

      <section class="filter-card cadastro-section">
        <div class="section-heading"><div><span class="section-kicker">EMPRESA E PERMISSÕES</span><h2>Vínculo funcional</h2></div></div>
        <div class="grid">
          <div class="campo">
            <label for="empresa_nome">Empresa</label>
            <input type="text" id="empresa_nome" value="Carregando empresa…" readonly>
            <input type="hidden" id="empresa">
          </div>
          <div class="campo"><label for="unidade">Unidade</label><select id="unidade" required disabled><option value="">Selecione</option></select></div>
          <div class="campo"><label for="equipe">Equipe</label><select id="equipe" required disabled><option value="">Selecione</option></select></div>
          <div class="campo"><label for="cargo">Cargo</label><select id="cargo" required disabled><option value="">Selecione</option></select></div>
          <div class="campo"><label>Matrícula</label><input type="text" value="Gerada automaticamente conforme o cargo" disabled></div>
          <div class="campo">
            <label for="perfil">Perfil funcional</label>
            <select id="perfil" required>
              <option value="">Selecione</option>
              <option value="funcionario">Funcionário</option>
              <option value="gestor">Gestor</option>
              <option value="rh">RH</option>
              <option value="administrador">Gestor de RH / Administrador da empresa</option>
            </select>
          </div>
          <div class="campo">
            <label for="tipo_contrato">Tipo de contrato</label>
            <select id="tipo_contrato" required>
              <option value="">Selecione</option>
              <option value="efetivo">Efetivo</option>
              <option value="comissionado">Comissionado</option>
              <option value="temporario">Temporário</option>
              <option value="estagiario">Estagiário</option>
              <option value="terceirizado">Terceirizado</option>
              <option value="outro">Outro</option>
            </select>
          </div>
          <div class="campo"><label for="data_admissao">Data de admissão</label><input type="date" id="data_admissao" required></div>
          <div class="campo carga-horaria-campo"><label for="carga_horaria">Carga horária semanal</label><input type="number" id="carga_horaria" min="1" max="168" step="0.5" required placeholder="Ex.: 40"></div>
        </div>
      </section>

      <div class="acoes cadastro-actions"><button type="button" id="limparCadastro" class="btn-secondary">Limpar</button><button type="button" class="btn-primary" onclick="cadastrarUsuario()">Concluir cadastro</button></div>
    </main>
  </form>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/validacaoCadastro.css') }}">
  <script src="{{ url_for('static', filename='js/validacaoCadastro.js') }}"></script>
  <script src="{{ url_for('static', filename='js/cadastroUsuario.js') }}"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/campos-padrao.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
  <script src="{{ url_for('static', filename='js/campos-padrao.js') }}"></script>
  <script src="{{ url_for('static', filename='js/dark-mode.js', v='dark-system-2026-11') }}"></script>
</body>
</html>
