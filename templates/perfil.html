<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Perfil — FrequenIA</title>

  <!-- Fonte Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- CSS Global (SEMPRE PRIMEIRO) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/frequenia-global.css') }}">
  <!-- CSS Específico -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/perfil.css') }}">

  <!--Dark-mode-->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/menu.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css') }}">

</head>

<body>

  {% set perfil_labels = {
    'administrador': 'Administrador',
    'funcionario': 'Funcionário',
    'gestor': 'Gestor',
    'rh': 'RH'
  } %}

  <div class="perfil-page">

    <!-- DADOS PESSOAIS -->
    <section class="card">
      <h3>Dados Pessoais</h3>

      <div class="dados-pessoais">
        <div class="foto">Foto</div>

        <div class="campos">
          <div class="campo">
            <label>Nome</label>
            <input type="text" id="nome" value="{{ user.nome }}" readonly>
          </div>

          <div class="campo">
            <label>Email</label>
            <input type="email" id="email" value="{{ user.email or 'Não informado' }}" readonly>
          </div>

          <div class="campo">
            <label>Telefone</label>
            <input type="text" id="telefone" value="{{ user.telefone or 'Não informado' }}" readonly>
          </div>

          <div class="campo">
            <label>CPF</label>
            <input type="text" id="cpf" value="{{ user.cpf }}" readonly>
          </div>

          <div class="campo">
            <label>Status da Conta</label>
            <input type="text" id="usuario_status" value="{{ user.usuario_status|title }}" readonly>
          </div>
        </div>
      </div>
    </section>

    <!-- DADOS DO TRABALHADOR -->
    <section class="card">
      <h3>Dados do Trabalhador</h3>

      <div class="grid">
        <div class="campo">
          <label>Empresa</label>
          <input type="text" id="empresa" value="{{ user.empresa_nome }}" disabled>
        </div>

        <div class="campo">
          <label>Unidade</label>
          <input type="text" id="unidade" value="{{ user.unidade_nome }}" disabled>
        </div>

        <div class="campo">
          <label>Equipe</label>
          <input type="text" id="equipe" value="{{ user.equipe_nome or 'Não definida' }}" disabled>
        </div>

        <div class="campo campo-cargo">
          <label>Cargo</label>
          <input type="text" id="cargo" value="{{ user.cargo_nome or 'Não definido' }}" disabled>
        </div>

        <div class="campo">
          <label>Matrícula</label>
          <input type="text" id="matricula" value="{{ user.matricula }}" disabled>
        </div>

        <div class="campo">
          <label>Perfil Funcional</label>
          <input type="text" id="perfil" value="{{ perfil_labels.get(user.perfil, user.perfil) }}" disabled>
        </div>

        <div class="campo">
          <label>Status do Vínculo</label>
          <input type="text" id="funcionario_status" value="{{ user.funcionario_status|title }}" disabled>
        </div>

        <div class="campo">
          <label>Data de Admissão</label>
          <input type="text" id="data_admissao" value="{{ user.data_admissao or 'Não definida' }}" disabled>
        </div>

        <div class="campo">
          <label>Tipo de Contrato</label>
          <input type="text" id="tipo_contrato" value="{{ (user.tipo_contrato|replace('_', ' ')|title) if user.tipo_contrato else 'Não definido' }}" disabled>
        </div>

        <div class="campo">
          <label>Carga Horária Semanal</label>
          <input type="text" id="carga_horaria_semanal" value="{{ (user.carga_horaria_semanal ~ ' horas') if user.carga_horaria_semanal is not none else 'Não definida' }}" disabled>
        </div>

        <div class="campo">
          <label>Jornada</label>
          <input type="text" id="jornada" value="Não definida" disabled>
        </div>
      </div>
    </section>

  </div>

</body>

</html>
