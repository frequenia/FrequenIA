<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocorrências</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/frequenia-global.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ocorrencias.css') }}">
</head>
<body>
  <main class="occurrences-page">
    <section class="card filters">
      <h1>Ocorrências e correções</h1>
      <div class="filter-grid">
        <label>Funcionário<select id="employee"><option value="">Todos</option></select></label>
        <label>Status<select id="status"><option value="">Todos</option><option value="pendente_gestor">Pendente com gestor</option><option value="encaminhada_rh">Encaminhada ao RH</option><option value="aprovada">Aprovada</option><option value="rejeitada">Rejeitada</option><option value="cancelada">Cancelada</option></select></label>
        <label>Categoria<select id="type"><option value="">Todas</option><option value="esquecimento_marcacao">Esquecimento</option><option value="horario_incorreto">Horário incorreto</option><option value="tipo_incorreto">Tipo incorreto</option><option value="justificativa">Justificativa</option><option value="outro">Outro</option></select></label>
        <label>De<input id="start" type="date"></label>
        <label>Até<input id="end" type="date"></label>
        <button id="search" class="btn-primary">Pesquisar</button>
      </div>
    </section>
    <section class="card table-card">
      <table><thead><tr><th>Funcionário</th><th>Categoria</th><th>Solicitação</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table>
    </section>
  </main>
  <dialog id="detail">
    <form method="dialog" class="detail-card">
      <button class="close" value="cancel" aria-label="Fechar">×</button>
      <h2>Detalhes da solicitação</h2>
      <dl id="detail-content"></dl>
      <section class="timeline-section"><h3>Histórico</h3><ol id="timeline" class="timeline"></ol></section>
      <label>Justificativa / observação<textarea id="observation" maxlength="1000" rows="3"></textarea></label>
      <p id="decision-error" class="error"></p>
      <div class="actions"><button id="forward" type="button">Encaminhar ao RH</button><button id="reject" type="button" class="danger">Rejeitar</button><button id="approve" type="button" class="btn-primary">Aprovar</button></div>
    </form>
  </dialog>
  <script src="{{ url_for('static', filename='js/ocorrencias.js') }}"></script>
</body>
</html>
