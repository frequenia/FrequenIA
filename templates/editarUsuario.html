<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Meu Perfil</title>

   <!-- Fonte Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS Global -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/worksync-global.css') }}">
  <!-- CSS Específico -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/editarUsuario.css') }}">

    <!--CSS Dark-mode-->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css') }}">
  
</head>

<body>

    <form id="formCadastro">
        <div class="perfil-page">

            <!-- DADOS PESSOAIS -->
            <section class="card">
                <h3>Dados Pessoais</h3>

                <div class="dados-pessoais">

                    <div class="campos">
                        <div class="campo">
                            <label>Nome</label>
                            <input type="text" id="nome" class="campo-editavel" value="{{ usuario.nome }}" readonly>
                        </div>

                        <div class="campo">
                            <label>Email</label>
                            <input type="text" id="email" class="campo-editavel" value="{{ usuario.email }}" readonly>
                        </div>

                        <div class="campo">
                            <label>Telefone</label>
                            <input type="text" id="telefone" class="campo-editavel" value="{{ usuario.telefone }}" readonly>
                        </div>

                        <div class="campo">
                            <label>CPF</label>
                            <input type="text" id="cpf" class="campo-editavel" value="{{ usuario.cpf }}" readonly>
                        </div>
                    </div>
                </div>
            </section>

            <!-- DADOS DO TRABALHADOR -->
            <section class="card">
                <h3>Dados do Trabalhador</h3>

                <div class="grid">

            <div class="campo">
                <label>Cargo</label>
                <select id="cargo" class="campo-editavel" disabled data-cargo="{{ usuario.cargo_id }}">
                    <option value="">Selecione</option>
                </select>
            </div>

            <div class="campo">
                <label>Setor</label>
                <select id="setor" class="campo-editavel" disabled data-setor="{{ usuario.setor_id }}">
                    <option value="">Selecione</option>
                </select>
            </div>

                    <div class="campo">
                        <label>Tipo de perfil</label>
                        <select id="tipo_perfil" disabled>
                            <option value="">Selecione</option>
                            <option value="admin" {% if usuario.tipo_perfil == 'admin' %}selected{% endif %}>Administrador</option>
                            <option value="funcionario" {% if usuario.tipo_perfil == 'funcionario' %}selected{% endif %}>Colaborador</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label>Tipo de contrato</label>
                        <select id="tipo_contrato" class="campo-editavel" disabled data-contrato="{{ usuario.tipo_contrato }}">
                            <option value="">Selecione</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label>Data de admissão</label>
                        <input type="date" id="data_admissao" class="campo-editavel" value="{{ usuario.data_admissao }}" readonly>
                    </div>

                    <div class="campo">
                        <label>Carga horária semanal</label>
                        <input type="text" id="carga_horaria" class="campo-editavel" value="{{ usuario.carga_horaria }}" readonly>
                    </div>

                </div>
            </section>

                <!-- AÇÕES -->
                <div class="acoes">
                    <button type="button" class="btn-primary" onclick="alterarDados()">Alterar Dados</button>
                    <button type="button" id="btnSalvar" class="btn-primary" style="display:none;" onclick="salvarAlteracoes()">Salvar</button>
                    <button type="button" class="btn-primary" onclick="deletarUsuario()">Excluir Usuário</button>
                    <button type="button" id="btnStatus" class="btn-primary" onclick="AtualizarStatus()" data-status="{{ usuario.status }}">
                        Inativar Usuário
                    </button>
                </div>
    </form>

    <script src="{{ url_for('static', filename='js/editarUsuario.js') }}"></script>

</body>
</html>
