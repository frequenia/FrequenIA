{% extends "auth_layout.html" %}
{% from "auth_password_field.html" import password_field %}
{% block form %}
<form class="auth-form" onsubmit="login(event)">
  <div class="auth-field">
    <label for="cpf">CPF</label>
    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" autocomplete="username" maxlength="14" oninput="mascaraCPF(this)" required>
  </div>
  {{ password_field("senha", "Senha", "current-password", 128) }}
  <div class="auth-forgot"><a href="/recuperacaoSenha">Esqueceu sua senha?</a></div>
  <button class="auth-submit" type="submit">Entrar <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
</form>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/login.js') }}"></script>{% endblock %}
