<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiosque de ponto - FrequenIA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/frequenia-global.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/reconhecimentoFacial.css') }}">
</head>
<body>
  <main class="facial-page"><section class="facial-content" aria-live="polite">
    <h1>Registrar ponto</h1>
    <p id="kiosk-status" role="status">Preparando a câmera…</p>
    <label for="matricula">Matrícula</label>
    <input id="matricula" name="matricula" autocomplete="off" inputmode="text" maxlength="128" required>
    <label for="tipo">Tipo de marcação</label>
    <select id="tipo" name="tipo">
      <option value="entrada">Entrada</option>
      <option value="saida_intervalo">Saída para intervalo</option>
      <option value="retorno_intervalo">Retorno do intervalo</option>
      <option value="saida">Saída</option>
    </select>
    <div class="card camera-card"><div class="camera-container">
      <video id="video" class="camera-video" autoplay muted playsinline></video>
      <div class="camera-overlay" aria-hidden="true">
        <div class="camera-frame-guide"></div>
        <span id="camera-state" class="camera-state">Abrindo câmera…</span>
      </div>
    </div></div>
    <button id="btnTentarCamera" class="btn-secondary" type="button" hidden>Tentar abrir a câmera novamente</button>
    <button id="btnRegistrar" class="btn-primary" type="button">Capturar e registrar</button>
    <p>Use boa iluminação e olhe diretamente para a câmera. Nenhuma imagem é guardada pelo navegador após a tentativa.</p>
  </section></main>
  <script src="{{ url_for('static', filename='js/reconhecimento.js') }}"></script>
</body>
</html>
