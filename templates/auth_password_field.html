{% macro password_field(id, label, autocomplete, maxlength, minlength=none, oninput=none) %}
<div class="auth-field">
  <label for="{{ id }}">{{ label }}</label>
  <div class="password-box">
    <input type="password" id="{{ id }}" name="{{ id }}" placeholder="{{ label }}" maxlength="{{ maxlength }}" autocomplete="{{ autocomplete }}"{% if minlength %} minlength="{{ minlength }}"{% endif %}{% if oninput %} oninput="{{ oninput }}"{% endif %} required>
    <button class="toggle show" type="button" onclick="toggleSenha(this)" aria-label="Mostrar ou ocultar {{ label|lower }}">
      <svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg>
    </button>
  </div>
</div>
{% endmacro %}
